# Production stack:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev file:
#   * no source bind-mount — the image is the artifact
#   * Gunicorn instead of runserver
#   * Nginx terminates HTTP, serves /static/ and /media/ straight off disk
#   * Postgres is not published to the host at all
#   * resource limits and log rotation on every service

name: alupan_prod

x-django-common: &django-common
  build:
    context: .
    dockerfile: docker/django/Dockerfile
    args:
      BUILD_ENV: production
  image: alupan/web:${IMAGE_TAG:-latest}
  restart: always
  env_file: [.env.prod]
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_ENV: production
    DJANGO_READ_DOT_ENV_FILE: "False"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]      # deliberately NOT published to the host
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  web:
    <<: *django-common
    command: /start-web.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  worker:
    <<: *django-common
    command: /start-worker.sh
    volumes:
      - media_volume:/app/media
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  beat:
    <<: *django-common
    command: /start-beat.sh
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: always
    depends_on: [web]
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
