# Development stack:  docker compose up --build
#
#   web    — Django dev server with autoreload, source bind-mounted
#   db     — PostgreSQL 16 with a named volume so data survives `down`
#   redis  — cache + Celery broker
#   worker — Celery worker
#   beat   — Celery beat scheduler

name: alupan

services:
  db:
    image: postgres:16-alpine
    container_name: alupan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alupan}
      POSTGRES_USER: ${POSTGRES_USER:-alupan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed only for local GUI clients (TablePlus/pgAdmin). Remove in prod.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alupan} -d ${POSTGRES_DB:-alupan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: alupan_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      args:
        BUILD_ENV: development
    container_name: alupan_web
    restart: unless-stopped
    command: /start-web.sh
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_ENV: development
      DJANGO_READ_DOT_ENV_FILE: "False"
    volumes:
      # Source is mounted so edits reload instantly without rebuilding.
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      args:
        BUILD_ENV: development
    container_name: alupan_worker
    restart: unless-stopped
    command: /start-worker.sh
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_READ_DOT_ENV_FILE: "False"
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      args:
        BUILD_ENV: development
    container_name: alupan_beat
    restart: unless-stopped
    command: /start-beat.sh
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_READ_DOT_ENV_FILE: "False"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
